name: Backend CI (GitHub Hosted)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-analyze:
    name: Build, Test & SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connessione alla VPN Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Mappa Ingress SonarQube
        run: echo "${{ secrets.RASPBERRY_TAILSCALE_IP }} sonarqube.local" | sudo tee -a /etc/hosts

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test (Unit & Integration)
        # Su ubuntu-latest Testcontainers funziona perfettamente di default senza bisogno di IP override
        run: ./mvnw clean compile verify

      - name: PIT Mutation Testing
        run: ./mvnw pitest:mutationCoverage

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.host.url=http://sonarqube.local \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.projectKey=karateflow-be \
            -Dsonar.qualitygate.wait=true
